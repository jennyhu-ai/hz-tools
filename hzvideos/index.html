<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>恒臻主动呈现训练营</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: rgba(248, 250, 252, 0.68);
      --line: rgba(255, 255, 255, 0.16);
      --panel: #f8fbff;
      --accent: #60a5fa;
      --drawer-ink: #15305f;
      --drawer-muted: #61789d;
      --drawer-line: #d8e7ff;
      --drawer-soft: #ecf5ff;
      --offline-bg: #fff4e5;
      --offline-ink: #c2410c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0027b7;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: fixed;
      inset: 0;
      background: #0027b7;
    }

    .feed {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    .slide {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #0027b7;
    }

    .video-layer {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0027b7;
    }

    video {
      width: min(100vw, calc(100svh * 9 / 16));
      height: min(100svh, calc(100vw * 16 / 9));
      object-fit: contain;
      background: #0027b7;
    }

    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.56), transparent 24%, transparent 82%, rgba(0,0,0,.52)),
        linear-gradient(90deg, rgba(0,0,0,.18), transparent 14%, transparent 86%, rgba(0,0,0,.18));
    }

    .topbar {
      display: none;
      position: fixed;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .brand {
      min-width: 0;
      pointer-events: auto;
    }

    .brand strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      line-height: 1.2;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-button,
    .side-button {
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(7, 11, 18, .52);
      backdrop-filter: blur(14px);
    }

    .icon-button {
      width: 40px;
      height: 40px;
    }

    .side-button {
      width: 48px;
      height: 48px;
    }

    svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .meta {
      display: none;
      position: absolute;
      z-index: 5;
      left: 16px;
      right: 78px;
      bottom: max(26px, env(safe-area-inset-bottom));
    }

    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      min-height: 25px;
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: var(--ink);
      font-weight: 750;
    }

    h1 {
      margin: 0;
      max-width: 12em;
      font-size: clamp(24px, 7vw, 38px);
      line-height: 1.15;
      letter-spacing: 0;
      text-shadow: 0 2px 20px rgba(0,0,0,.42);
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .side-actions {
      position: absolute;
      z-index: 6;
      right: 13px;
      bottom: max(108px, calc(env(safe-area-inset-bottom) + 92px));
      display: grid;
      gap: 12px;
    }

    .center-play {
      position: absolute;
      z-index: 7;
      left: 50%;
      top: 50%;
      width: 82px;
      height: 82px;
      display: none;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0,0,0,.48);
      backdrop-filter: blur(12px);
    }

    .slide.paused .center-play { display: grid; }

    .center-play svg {
      width: 34px;
      height: 34px;
      fill: currentColor;
      stroke: none;
    }

    .drawer {
      position: fixed;
      z-index: 40;
      inset: auto 0 0 0;
      height: min(70svh, 600px);
      display: grid;
      grid-template-rows: auto 1fr;
      border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      background: var(--panel);
      color: var(--drawer-ink);
      transform: translateY(102%);
      transition: transform 170ms ease;
      backdrop-filter: blur(18px);
    }

    .drawer.open { transform: translateY(0); }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 16px 10px;
      border-bottom: 1px solid var(--drawer-line);
    }

    .drawer-head strong {
      display: block;
      font-size: 16px;
    }

    .drawer-head span {
      display: block;
      margin-top: 3px;
      color: var(--drawer-muted);
      font-size: 12px;
    }

    .episode-list {
      overflow-y: auto;
      padding: 8px 8px max(16px, env(safe-area-inset-bottom));
    }

    .episode-row {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 8px;
      text-align: left;
    }

    .episode-row.active {
      background: var(--drawer-soft);
    }

    .row-no {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: #e7f0ff;
      font-size: 13px;
      font-weight: 750;
    }

    .episode-row.active .row-no {
      background: #2563eb;
      color: #fff;
    }

    .row-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 650;
    }

    .row-meta {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--drawer-muted);
      font-size: 12px;
    }

    .offline-tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      margin-left: 6px;
      padding: 2px 8px;
      border: 1px solid #fed7aa;
      border-radius: 999px;
      background: var(--offline-bg);
      color: var(--offline-ink);
      font-size: 12px;
      font-weight: 750;
      vertical-align: middle;
    }

    .empty {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    body.no-videos .empty { display: grid; }

    @media (min-width: 760px) {
      .meta {
        left: calc(50vw - 240px);
        right: auto;
        width: 400px;
      }

      .side-actions {
        right: calc(50vw - 310px);
      }
    }
  </style>
</head>

  <script>
    const data = JSON.parse(document.getElementById("series-data").textContent);
    const available = data.availableEpisodes;
    const allEpisodes = data.episodes;

    let muted = true;
    let userPausedIndex = null;

    const icons = {
      soundOff: '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 5M21 9l-5 5"/>',
      soundOn: '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
      play: '<path d="M8 5v14l11-7Z"/>',
      pause: '<path d="M8 5h3v14H8zM13 5h3v14h-3z"/>',
    };

    function assetUrl(relativePath) {
      if (!relativePath) return "";
      const base = data.cosBaseUrl;
      if (base && base !== "__COS_BASE_URL__") return base + "/" + relativePath.replace(/^\.\//, "");
      return relativePath;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[char]);
    }

    function renderSlides() {
      if (available.length === 0) {
        document.body.classList.add("no-videos");
        progressText.textContent = "暂无视频";
        return;
      }

      feed.innerHTML = available.map((episode, index) => (
        '<article class="slide paused" data-index="' + index + '" data-no="' + episode.no + '">' +
          '<div class="video-layer"><video autoplay playsinline webkit-playsinline muted loop preload="none" poster="' + assetUrl(episode.cover) + '"></video></div>' +
          '<div class="shade"></div>' +
          '<button class="center-play" type="button" aria-label="播放"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg></button>' +
          '<div class="side-actions">' +
            '<button class="side-button pause-button" type="button" aria-label="播放或暂停"><svg viewBox="0 0 24 24" aria-hidden="true">' + icons.play + '</svg></button>' +
            '<button class="side-button sound-button" type="button" aria-label="声音"><svg viewBox="0 0 24 24" aria-hidden="true">' + icons.soundOff + '</svg></button>' +
            '<button class="side-button list-button" type="button" aria-label="目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></button>' +
          '</div>' +
          '<div class="meta">' +
            '<div class="kicker"><span class="pill">' + episode.no + ' / ' + allEpisodes.length + '</span><span>' + escapeHtml(episode.category) + '</span></div>' +
            '<h1>' + escapeHtml(episode.title) + '</h1>' +
          '</div>' +
        '</article>'
      )).join("");
    }

    function renderList() {
      episodeList.innerHTML = allEpisodes.map((episode) => {
        const index = available.findIndex((item) => item.no === episode.no);
        const disabled = index === -1;
        return '<button class="episode-row' + (index === activeIndex ? " active" : "") + (disabled ? " unavailable" : "") + '" type="button" data-index="' + index + '"' + (disabled ? " disabled" : "") + '>' +
          '<span class="row-no">' + episode.no + '</span>' +
          '<span><span class="row-title">' + escapeHtml(episode.title) + (disabled ? '<span class="offline-tag">未上线</span>' : "") + '</span><span class="row-meta">' + escapeHtml(episode.category) + '</span></span>' +
        '</button>';
      }).join("");
    }

    function hydrateAround(index) {
      document.querySelectorAll(".slide").forEach((slide) => {
        const slideIndex = Number(slide.dataset.index);
        const video = slide.querySelector("video");
        if (Math.abs(slideIndex - index) <= 1) {
          if (!video.src) video.src = assetUrl(available[slideIndex].video);
          video.preload = slideIndex === index ? "auto" : "metadata";
        } else {
          video.pause();
          video.removeAttribute("src");
          video.load();
          video.preload = "none";
        }
      });
    }

    function setActive(index, shouldScroll) {
      activeIndex = Math.max(0, Math.min(index, available.length - 1));
      hydrateAround(activeIndex);
      progressText.textContent = "第 " + available[activeIndex].no + " 集 · " + (activeIndex + 1) + " / " + available.length;

      document.querySelectorAll(".slide").forEach((slide) => {
        const slideIndex = Number(slide.dataset.index);
        const video = slide.querySelector("video");
        video.muted = muted;
        if (slideIndex === activeIndex) {
          if (userPausedIndex === activeIndex) {
            video.pause();
            slide.classList.add("paused");
            return;
          }
          video.play().then(() => {
            slide.classList.remove("paused");
            updatePlaybackButtons();
          }).catch(() => {
            slide.classList.add("paused");
            updatePlaybackButtons();
          });
        } else {
          video.pause();
          slide.classList.remove("paused");
        }
      });
      updatePlaybackButtons();

      document.querySelectorAll(".episode-row").forEach((row) => {
        row.classList.toggle("active", Number(row.dataset.index) === activeIndex);
      });

      if (shouldScroll) {
        document.querySelector('.slide[data-index="' + activeIndex + '"]').scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function togglePlayback() {
      const slide = document.querySelector('.slide[data-index="' + activeIndex + '"]');
      if (!slide) return;
      const video = slide.querySelector("video");
      if (video.paused) {
        userPausedIndex = null;
        video.play().then(() => {
          slide.classList.remove("paused");
          updatePlaybackButtons();
        }).catch(() => {
          slide.classList.add("paused");
          updatePlaybackButtons();
        });
      } else {
        userPausedIndex = activeIndex;
        video.pause();
        slide.classList.add("paused");
        updatePlaybackButtons();
      }
    }

    function updatePlaybackButtons() {
      document.querySelectorAll(".slide").forEach((slide) => {
        const video = slide.querySelector("video");
        const icon = slide.querySelector(".pause-button svg");
        if (!video || !icon) return;
        icon.innerHTML = video.paused ? icons.play : icons.pause;
        slide.classList.toggle("paused", video.paused && Number(slide.dataset.index) === activeIndex);
      });
    }

    function bindPlaybackState(slide) {
      const video = slide.querySelector("video");
      video.addEventListener("play", updatePlaybackButtons);
      video.addEventListener("pause", updatePlaybackButtons);
      video.addEventListener("ended", updatePlaybackButtons);
    }

    function toggleSound() {
      muted = !muted;
      soundIcon.innerHTML = muted ? icons.soundOff : icons.soundOn;
      document.querySelectorAll("video").forEach((video) => {
        video.muted = muted;
      });
      document.querySelectorAll(".sound-button svg").forEach((icon) => {
        icon.innerHTML = muted ? icons.soundOff : icons.soundOn;
      });
      const current = document.querySelector('.slide[data-index="' + activeIndex + '"] video');
      if (current) current.play().catch(() => {});
    }

    function openDrawer() {
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }

    function hideDrawer() {
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) setActive(Number(visible.target.dataset.index), false);
    }, { threshold: [0.62, 0.78] });

    renderSlides();
    renderList();
    drawerSummary.textContent = available.length + " / " + allEpisodes.length + " 集已上线";

    document.querySelectorAll(".slide").forEach((slide) => {
      bindPlaybackState(slide);
      observer.observe(slide);
      slide.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;
        togglePlayback();
      });
    });

    document.querySelectorAll(".center-play, .pause-button").forEach((button) => button.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      togglePlayback();
    }));
    document.querySelectorAll(".list-button").forEach((button) => button.addEventListener("click", openDrawer));
    document.querySelectorAll(".sound-button").forEach((button) => button.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      toggleSound();
    }));
    soundButton.addEventListener("click", toggleSound);
    menuButton.addEventListener("click", openDrawer);
    closeDrawer.addEventListener("click", hideDrawer);
    episodeList.addEventListener("click", (event) => {
      const row = event.target.closest(".episode-row");
      if (!row || row.disabled) return;
      hideDrawer();
      setActive(Number(row.dataset.index), true);
    });

    if (available.length) setActive(0, false);
  </script>
</body>
</html>
